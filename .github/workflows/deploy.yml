name: Generate & Deploy Dashboard

on:
  push:
    branches:
      - main
    paths:
      - '*.csv'
      - 'history/*.csv'
      - 'main.go'
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Generate Dashboard
        run: |
          go run main.go
          mkdir -p public
          cp rotation_dashboard.html public/index.html
          cp market_data.json public/market_data.json
          cp llm_signals.json public/llm_signals.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
